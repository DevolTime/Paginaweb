    <main>

        <h1 class="contacto-title">Contacto</h1>
        <p class="correo_texto">Si deseas ponerte en contacto conmigo, puedes hacerlo a través del siguiente medio:</p>

        <form class="contact-form" action="https://formspree.io/f/xwvrbygn" method="POST">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" placeholder="Nombre" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

            <label for="subject">Asunto:</label>
            <input type="text" id="subject" name="subject" placeholder="Asunto" required>

            <label for="message">Mensaje:</label>
            <textarea id="message" name="message" placeholder="Escribe aquí tu mensaje" required></textarea>

            <button type="submit">Enviar</button>

        </form>

    </main>
