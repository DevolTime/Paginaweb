<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./../CSS/formu.css">
    <link rel="stylesheet" href="./../CSS/home.css">

</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="./../img/logo.png" alt="logo" class="imag">
            </div>
            <ul class="menu_list">
                <li class="item"><a href="home.html">Inicio</a></li>
                <li class="item dropdown">
                    <a href="galeria.html" class="dropbtn">Galeria</a>
                    <div class="dropdown-content">
                        <a href="galeria.html">Todas</a>
                        <a href="#">Fotos</a>
                        <a href="#">Videos</a>
                    </div>
                </li>
                <li class="item"><a href="contacto.html">Contacto</a></li>
                <li class="item"><a href="#">Formulario</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="formu-for">
            <form action="" class="formulario">
                <div>
                <h1 class="uno">Formulario</h1>
                <p class="dos">Ingresa tus datos</p>

                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" placeholder="Nombre" required>

                <label for="lastname">Apellido:</label>
                <input type="text" id="lastname" name="lastname" placeholder="Apellido" required>

                <label for="fecha">Fecha de Nacimiento:</label>
                <input type="date" id="fecha" name="fecha" placeholder="Fecha de Nacimiento" required>

                <label for="estadocivil">Estado Civil:</label>
                <select id="estadocivil" name="estadocivil" required>
                    <option value="">Seleccionar</option>
                    <option value="soltero">Soltero</option>
                    <option value="casado">Casado</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="viudo">Viudo</option>
                </select>

                <label for="tel">Celular:</label>
                <input type="tel" id="tel" name="tel" placeholder="Celular" required>

                <label for="Cedula">Cédula:</label>
                <input type="number" id="cedula" name="cedula" placeholder="Cédula" required>

                <label for="lugardeexpedicion">Lugar de Expedición:</label>
                <input type="text" id="lugardeexpedicion" name="lugardeexpedicion" placeholder="Lugar de Expedición"
                    required>

                <label for="fechadeexpedicion">Fecha de Expedición:</label>
                <input type="date" id="fechadeexpedicion" name="fechadeexpedicion" placeholder="Fecha de Expedición"
                    required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

                <label for="pais">País:</label>
                <input type="text" id="pais" name="pais" placeholder="País" required>

                <label for="departamento">Departamento:</label>
                <input type="text" id="departamento" name="departamento" placeholder="Departamento" required>

                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad" required>

                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" placeholder="Dirección" required>

                <label for="CodigoPostal">Código Postal:</label>
                <input type="text" id="CodigoPostal" name="CodigoPostal" placeholder="Código Postal" required>

                <label for="alergias">¿Tienes alergias?</label>
                <select id="alergias" name="alergias" required>
                    <option value="">Seleccionar</option>
                    <option value="si">Si</option>
                    <option value="no">No</option>
                </select>

                <label for="archivo">Archivo:</label>
                <input type="file" id="archivo" name="archivo" required>

                <div class="tercon">
                    <a href="#">Política de Privacidad</a>
                    <a href="#">Terminos y Condiciones</a>

                    <label for="terminos">Acepto los términos y condiciones</label>
                    <input type="checkbox" id="terminos" name="terminos" required>
                </div>

                <button type="submit">Enviar</button>
            </div>
            </form>
        </section>

    </main>
    <footer>
        <p>© 2026 Todos los derechos reservados</p>
    </footer>

</body>

</html>
